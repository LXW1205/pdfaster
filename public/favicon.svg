<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- pdfaster · Hi-Fi Instrument · Braun dial glyph (design/DESIGN.md contract) -->
  <defs>
    <radialGradient id="toplight" cx="0.35" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </radialGradient>
  </defs>
  <!-- cream casing + engraved rim -->
  <rect width="48" height="48" rx="10" fill="#f7f5ef"/>
  <rect x="4" y="4" width="40" height="40" rx="7.5" fill="none" stroke="#d9d5cc" stroke-width="1.5"/>
  <!-- control dial: black key, top-lit -->
  <circle cx="24" cy="24" r="13" fill="#1a1a18"/>
  <circle cx="24" cy="24" r="13" fill="url(#toplight)"/>
  <circle cx="24" cy="24" r="9" fill="none" stroke="#f7f5ef" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- signal pointer (orange = engaged) -->
  <rect x="22.6" y="13.5" width="2.8" height="9" rx="1.4" fill="#ff6b1a"/>
</svg>
